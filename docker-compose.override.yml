# =============================================================================
# Docker Compose Override — Development Overrides
# =============================================================================
# Use this file for local development to:
#   - Mount source code as volumes (hot reload)
#   - Expose additional ports
#   - Disable resource limits
#
# Usage: docker compose -f docker-compose.yml -f docker-compose.override.yml up
# =============================================================================

services:
  server:
    environment:
      NODE_ENV: development
    volumes:
      - ./server:/app
      - /app/node_modules
    ports:
      - "5000:5000"
    deploy:
      resources:
        limits: {}
        reservations: {}
    security_opt: []
    cap_drop: []
    cap_add:
      - ALL
    read_only: false
    tmpfs: []

  client:
    build:
      args:
        - NODE_ENV=development
    volumes:
      - ./client:/app
      - /app/node_modules
    ports:
      - "3000:80"
    deploy:
      resources:
        limits: {}
        reservations: {}
    security_opt: []
    cap_drop: []
    cap_add:
      - ALL
    read_only: false
    tmpfs: []

  nginx:
    ports:
      - "80:80"
    deploy:
      resources:
        limits: {}
        reservations: {}
    security_opt: []
    cap_drop: []
    cap_add:
      - ALL
    read_only: false
    tmpfs: []

  mongodb:
    deploy:
      resources:
        limits: {}
        reservations: {}
    security_opt: []
    cap_drop: []
    cap_add:
      - ALL
