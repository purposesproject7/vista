# =============================================================================
# WAF Nginx Configuration — ModSecurity + OWASP CRS
# =============================================================================
# deploy.sh regenerates this file at deploy time with the correct domain,
# SSL settings, and port configuration.
#
# This default config: HTTP-only, localhost, no SSL.
# deploy.sh --https: adds SSL termination and HTTP→HTTPS redirect.
# =============================================================================

load_module modules/ngx_http_modsecurity_module.so;

worker_processes auto;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    keepalive_timeout 65;
    client_max_body_size 50M;

    log_format waf '$remote_addr - $remote_user [$time_local] '
                   '"$request" $status $body_bytes_sent '
                   '"$http_referer" "$http_user_agent" '
                   'WAF:$upstream_http_x_waf_action';

    access_log /var/log/nginx/access.log waf;
    error_log  /var/log/nginx/error.log warn;

    limit_req_zone $binary_remote_addr zone=waf_login:10m rate=5r/m;
    limit_req_zone $binary_remote_addr zone=waf_api:10m rate=100r/m;
    limit_req_zone $binary_remote_addr zone=waf_static:10m rate=500r/m;

    upstream app {
        server vista-nginx:80 max_fails=3 fail_timeout=10s;
    }

    server {
        listen 80 default_server;
        server_name _;

        # ModSecurity
        modsecurity on;
        modsecurity_rules_file /etc/nginx/modsecurity-rules.conf;

        # Security headers
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header X-WAF-Action "passed" always;

        location /api/ {
            limit_req zone=waf_api burst=20 nodelay;
            proxy_pass http://app;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection '';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;
            proxy_connect_timeout 120s;
            proxy_send_timeout 300s;
            proxy_read_timeout 300s;
        }

        location ~ ^/api/auth/(login|register|setup-password|reset-password) {
            limit_req zone=waf_login burst=5 nodelay;
            proxy_pass http://app;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /health {
            access_log off;
            proxy_pass http://app/health;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
        }

        location / {
            limit_req zone=waf_static burst=100 nodelay;
            proxy_pass http://app;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_cache_bypass $http_upgrade;
        }

        location ~ /\.(git|env|svn|htaccess|htpasswd) {
            deny all;
            access_log off;
            return 404;
        }

        location ~ /(node_modules|vendor|bin|scripts) {
            deny all;
            access_log off;
            return 404;
        }

        location ~* (cmd|shell|exec|eval|system|passthru|wp-config) {
            deny all;
            return 403;
        }

        error_page 502 503 504 /50x.html;
        location = /50x.html {
            root /usr/share/nginx/html;
            internal;
        }

        error_page 429 @rate_limited;
        location @rate_limited {
            default_type application/json;
            return 429 '{"success":false,"message":"Too many requests. Please slow down."}';
        }
    }
}
