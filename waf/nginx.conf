# =============================================================================
# WAF Nginx Configuration — ModSecurity + OWASP CRS
# =============================================================================
# This runs as the edge proxy, filtering all traffic before it reaches
# the application nginx. Every request is inspected by OWASP Core Rule Set.
# =============================================================================

load_module modules/ngx_http_modsecurity_module.so;

worker_processes auto;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # ------------------------------------------------------------------
    # Basic settings
    # ------------------------------------------------------------------
    sendfile        on;
    keepalive_timeout 65;
    client_max_body_size 50M;

    # ------------------------------------------------------------------
    # Logging
    # ------------------------------------------------------------------
    log_format waf '$remote_addr - $remote_user [$time_local] '
                   '"$request" $status $body_bytes_sent '
                   '"$http_referer" "$http_user_agent" '
                   'WAF:$upstream_http_x_waf_action';

    access_log /var/log/nginx/access.log waf;
    error_log  /var/log/nginx/error.log warn;

    # ------------------------------------------------------------------
    # Upstream — the internal nginx reverse proxy
    # ------------------------------------------------------------------
    upstream app {
        server vista-nginx:80 max_fails=3 fail_timeout=10s;
    }

    # ------------------------------------------------------------------
    # Server — HTTP (plaintext)
    # ------------------------------------------------------------------
    server {
        listen 80 default_server;
        server_name _;

        # ---- ModSecurity WAF -----------------------------------------
        modsecurity on;
        modsecurity_rules_file /etc/nginx/modsecurity-rules.conf;

        # ---- Security headers (defence-in-depth) ----------------------
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header X-WAF-Action "passed" always;

        # ---- Rate limiting (per IP) -----------------------------------
        limit_req_zone $binary_remote_addr zone=waf_login:10m rate=5r/m;
        limit_req_zone $binary_remote_addr zone=waf_api:10m rate=100r/m;
        limit_req_zone $binary_remote_addr zone=waf_static:10m rate=500r/m;

        # ---- API routes (strict rate limit) --------------------------
        location /api/ {
            limit_req zone=waf_api burst=20 nodelay;
            proxy_pass http://app;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection '';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;

            proxy_connect_timeout 120s;
            proxy_send_timeout    300s;
            proxy_read_timeout    300s;
        }

        # ---- Login endpoint (very strict rate limit) -----------------
        location ~ ^/api/auth/(login|register|setup-password|reset-password) {
            limit_req zone=waf_login burst=5 nodelay;
            proxy_pass http://app;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ---- Health check (unrestricted) -----------------------------
        location /health {
            access_log off;
            proxy_pass http://app/health;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
        }

        # ---- Static assets / frontend (relaxed) ----------------------
        location / {
            limit_req zone=waf_static burst=100 nodelay;
            proxy_pass http://app;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_cache_bypass $http_upgrade;
        }

        # ---- Block access to sensitive paths -------------------------
        location ~ /\.(git|env|svn|htaccess|htpasswd) {
            deny all;
            access_log off;
            return 404;
        }

        location ~ /(node_modules|vendor|bin|scripts) {
            deny all;
            access_log off;
            return 404;
        }

        # ---- Deny common attack patterns (belt-and-suspenders) -------
        location ~* (cmd|shell|exec|eval|system|passthru|wp-config) {
            deny all;
            return 403;
        }

        # ---- Error pages ---------------------------------------------
        error_page 502 503 504 /50x.html;
        location = /50x.html {
            root /usr/share/nginx/html;
            internal;
        }

        error_page 429 @rate_limited;
        location @rate_limited {
            default_type application/json;
            return 429 '{"success":false,"message":"Too many requests. Please slow down."}';
        }
    }
}
