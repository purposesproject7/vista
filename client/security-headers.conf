# =============================================================================
# Security headers for the frontend origin
# =============================================================================
# Included from every location block in nginx.conf.
#
# WHY AN INCLUDE: nginx's add_header directives are NOT inherited into a
# location block that declares an add_header of its own. The cache-control
# locations below used to silently drop every server-level security header,
# which is why scanners reported them as missing on static assets.
# Keep this file included in *every* location that sets any header.
# =============================================================================

add_header X-Frame-Options "SAMEORIGIN" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-XSS-Protection "1; mode=block" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;

# Ignored by browsers when the page is served over plain HTTP, so this is safe
# for HTTP-only deployments and still correct when TLS is terminated upstream.
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

# Content-Security-Policy
#   script-src  'self'          - bundle is same-origin, no inline/eval code
#   style-src   'unsafe-inline' - required by React inline styles, Tailwind and
#                                 react-hot-toast's injected <style> tags
#               fonts.googleapis.com - Google Fonts stylesheet in index.html
#   font-src    fonts.gstatic.com    - the font files that stylesheet points to
#   img-src     https:          - remote avatars (ui-avatars.com) and any image
#                                 URL stored in the database
#   connect-src 'self'          - API is same-origin at /api
#   worker-src  blob:           - xlsx export builds files in memory
# NOTE: deliberately no upgrade-insecure-requests; it would break the
# HTTP-only deployment mode supported by deploy.sh.
add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'self'; form-action 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: https:; connect-src 'self'; worker-src 'self' blob:; manifest-src 'self'" always;
